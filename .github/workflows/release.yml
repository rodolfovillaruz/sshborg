name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Job-level `if:` can't reference secrets, so gate every later step on this
      # step's output instead. Keeps a tag push from failing loudly before the
      # ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
      # ANDROID_KEY_PASSWORD secrets are configured.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Signing secrets are not configured yet (see README#releasing)."
          fi

      - name: Set up JDK 21
        if: steps.signing.outputs.configured == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        if: steps.signing.outputs.configured == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Write local.properties
        if: steps.signing.outputs.configured == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Public values (not secrets), set as repository *variables*: the Google Web client ID and the
          # reflector Worker's https origin. Either unset = Google sign-in stays hidden.
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_AUTH_BASE: ${{ vars.GOOGLE_AUTH_BASE }}
        run: |
          cat > local.properties <<EOF
          signing.storeFile=${KEYSTORE_PATH}
          signing.storePassword=${STORE_PASSWORD}
          signing.keyAlias=${KEY_ALIAS}
          signing.keyPassword=${KEY_PASSWORD}
          EOF
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_AUTH_BASE" ]; then
            echo "google.clientId=${GOOGLE_CLIENT_ID}" >> local.properties
            echo "google.authBase=${GOOGLE_AUTH_BASE}" >> local.properties
          fi

      - name: Assemble release APK
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - name: Remove signing material
        if: always() && steps.signing.outputs.configured == 'true'
        run: |
          rm -f local.properties "$KEYSTORE_PATH"

      - name: Upload release APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sshborg-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
